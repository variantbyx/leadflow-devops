name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ── 1. Backend Testing ───────────────────────────────────────────
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: leadflow_test
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package.json

      - name: Install Dependencies
        run: npm ci

      - name: Lint & Typecheck
        run: npm run lint

      - name: Run Integration Tests
        env:
          DATABASE_URL: postgres://testuser:testpassword@localhost:5432/leadflow_test
        run: npm test

  # ── 2. Frontend Testing ──────────────────────────────────────────
  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build Next.js
        run: npm run build

  # ── 3. Build Docker Images ───────────────────────────────────────
  build-images:
    name: Build Docker Images
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: leadflow-backend:${{ github.sha }}

      - name: Build Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: leadflow-frontend:${{ github.sha }}

  # ── 4. Deploy & Verify Release ───────────────────────────────────
  deploy-and-verify:
    name: Deploy & Health Verification
    needs: [build-images]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create local Kubernetes cluster (Kind)
        uses: helm/kind-action@v1.10.0
        with:
          cluster_name: leadflow-ci

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init & Apply
        run: |
          cd terraform
          terraform init
          terraform apply -auto-approve

      - name: Verify Health Probes
        run: |
          echo "Verifying deployment readiness..."
          kubectl rollout status deployment/leadflow-db -n leadflow --timeout=90s
          kubectl rollout status deployment/leadflow-backend -n leadflow --timeout=90s
          kubectl rollout status deployment/leadflow-frontend -n leadflow --timeout=90s
          echo "All deployments healthy!"