name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ── 1. Backend Testing ───────────────────────────────────────────
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: leadflow_test
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package.json

      - name: Install Dependencies
        run: npm ci

      - name: Lint & Typecheck
        run: npm run lint

      - name: Run Integration Tests
        env:
          DATABASE_URL: postgres://testuser:testpassword@localhost:5432/leadflow_test
        run: npm test

  # ── 2. Frontend Testing ──────────────────────────────────────────
  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build Next.js
        run: npm run build

  # ── 3. Build, Deploy & Verify in Cluster ─────────────────────────
  build-and-deploy:
    name: Build, Deploy & Verify
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Image
        run: docker build -t leadflow-backend:latest ./backend

      - name: Build Frontend Image
        run: docker build -t leadflow-frontend:latest ./frontend

      - name: Create local Kubernetes cluster (Kind)
        uses: helm/kind-action@v1.10.0
        with:
          cluster_name: leadflow-ci

      - name: Load Images into Kind Cluster
        run: |
          kind load docker-image leadflow-backend:latest --name leadflow-ci
          kind load docker-image leadflow-frontend:latest --name leadflow-ci

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init & Apply
        run: |
          cd terraform
          terraform init
          terraform apply -auto-approve

      - name: Verify Deployment Rollouts
        run: |
          echo "Verifying deployment rollouts..."
          kubectl rollout status deployment/leadflow-db -n leadflow --timeout=120s
          kubectl rollout status deployment/leadflow-backend -n leadflow --timeout=120s
          kubectl rollout status deployment/leadflow-frontend -n leadflow --timeout=120s
          echo "All deployments are healthy!"

      - name: Verify Live Endpoints
        run: |
          # Port forward backend service and test health checks
          kubectl port-forward svc/leadflow-backend -n leadflow 3001:3001 &
          sleep 5
          curl -f http://localhost:3001/healthz
          curl -f http://localhost:3001/readyz
          echo "Health probes responded with 200 OK!"